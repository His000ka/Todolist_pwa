name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-todolist-pwa/package-lock.json

      - name: Install dependencies
        working-directory: frontend-todolist-pwa
        run: npm ci --legacy-peer-deps

      - name: Type check
        working-directory: frontend-todolist-pwa
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend-todolist-pwa
        run: npm run lint || true

      - name: Build
        working-directory: frontend-todolist-pwa
        run: npm run build
